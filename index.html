         site-wide so the fonts are available both in the admin preview AND on the public
         feedback-form pages where the certificate canvas is actually composited. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@400;700&family=Marcellus&family=Alex+Brush&family=Great+Vibes&family=Dancing+Script&family=Tangerine&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
