name: Build and Deploy to Hostinger
on:
  push:
    branches:
      - master
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm install
      - name: Build Project
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
          VITE_GOOGLE_PLACE_ID: ${{ secrets.VITE_GOOGLE_PLACE_ID }}
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
          # Public OAuth web client ID (not a secret — safe to ship in the
          # bundle either way) for the admin-only Google Contacts sync.
          # src/lib/googleContacts.js also hardcodes this same value as a
          # fallback if this env var is ever missing.
          VITE_GOOGLE_CLIENT_ID: 233910635732-5r08r906shpjc9m46hgc9u31t5fpt9k6.apps.googleusercontent.com
          # Reuses the same service-account secret scripts/fetch-health-news.js
          # already relies on — the build now also runs
          # scripts/generate-sitemap.js (pre-build) and
          # scripts/generate-static-meta.js (post-build) via "npm run build"
          # (see package.json), both of which degrade gracefully (warn +
          # static-only output) if this isn't set, so the build never fails
          # over it — but it needs to be a real repo secret for the dynamic
          # (webinar/course/blog/news/announcement) pages to actually
          # generate real content instead of just the static routes.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run build
      # Writes the mocktest PHP API's runtime secrets into the build output
      # (never committed) — a separate copy from the build-time
      # FIREBASE_SERVICE_ACCOUNT secret above, since that one is only ever
      # used Node-side during this same job and shouldn't also become a
      # standing runtime secret sitting on the server. Protected by
      # public/api/mocktest/_private/.htaccess (Require all denied, copied
      # into dist/ verbatim by Vite like any other public/ file).
      - name: Write mocktest API runtime config
        env:
          MOCKTEST_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.MOCKTEST_FIREBASE_SERVICE_ACCOUNT }}
          MOCKTEST_BREVO_API_KEY: ${{ secrets.MOCKTEST_BREVO_API_KEY }}
          MOCKTEST_BREVO_FROM_EMAIL: ${{ secrets.MOCKTEST_BREVO_FROM_EMAIL }}
          MOCKTEST_CRON_SECRET: ${{ secrets.MOCKTEST_CRON_SECRET }}
        run: |
          mkdir -p dist/api/mocktest/_private
          printf '%s' "$MOCKTEST_FIREBASE_SERVICE_ACCOUNT" > dist/api/mocktest/_private/service-account.json
          cat > /tmp/write-mocktest-secrets.php << 'PHPSCRIPT'
          <?php
          $out = "<?php\nreturn [\n";
          $out .= "    'BREVO_API_KEY' => " . var_export(getenv('MOCKTEST_BREVO_API_KEY'), true) . ",\n";
          $out .= "    'BREVO_FROM_EMAIL' => " . var_export(getenv('MOCKTEST_BREVO_FROM_EMAIL') ?: 'no-reply@medwebpk.com', true) . ",\n";
          $out .= "    'BREVO_FROM_NAME' => 'MEDWEB',\n";
          $out .= "    'CRON_SECRET' => " . var_export(getenv('MOCKTEST_CRON_SECRET'), true) . ",\n";
          $out .= "];\n";
          file_put_contents('dist/api/mocktest/_private/secrets.php', $out);
          PHPSCRIPT
          php /tmp/write-mocktest-secrets.php
      # Every FTP-Deploy-Action variant (splitting by folder, then by file
      # type, with longer timeouts each time) hit the identical
      # ECONNRESET at the identical point — creating a folder — which
      # means the action's own connection handling (it's built on the
      # basic-ftp library) is the actual problem, not transfer size/
      # duration. lftp's `mirror` handles an entire directory tree in one
      # session with real reconnect/retry built in, so one step now
      # replaces all of those. `--delete` is deliberately NOT used —
      # this mirrors local dist/ onto /public_html additively, so a file
      # that exists on the server but not in this build (e.g. an asset
      # from a previous Vite content-hash) is left alone rather than
      # removed.
      - name: Deploy to Hostinger via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "set ftp:ssl-allow no; set ftp:passive-mode yes; set net:timeout 60; set net:max-retries 8; set net:reconnect-interval-base 10; set net:reconnect-interval-max 60; open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; mirror -R --verbose --parallel=2 ./dist /public_html"
