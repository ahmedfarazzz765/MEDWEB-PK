name: Build and Deploy to Hostinger
on:
  push:
    branches:
      - master
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm install
      - name: Build Project
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
          VITE_GOOGLE_PLACE_ID: ${{ secrets.VITE_GOOGLE_PLACE_ID }}
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
        run: npm run build
      # Hostinger's FTP server has been resetting the data-socket connection
      # mid-transfer ("read ECONNRESET") during/after the ~9MB assets/
      # upload, causing the job to fail outright and need a manual re-run.
      # SamKirkland/FTP-Deploy-Action doesn't expose a concurrency/threads
      # input (it isn't git-ftp — this is a separate project built on
      # basic-ftp) as far as I can tell, and nick-fields/retry can only
      # retry a shell `command`, not wrap a `uses:` action like this one —
      # so instead of a single step, this is the same deploy step run up
      # to 3 times with a cooldown between attempts, continuing past a
      # failed attempt only to try again. `log-level: verbose` is on for
      # now so a failure's actual FTP-level cause shows up in the log —
      # worth turning back down to `standard` once this is confirmed fixed.
      - name: Deploy to Hostinger via FTP (attempt 1/3)
        id: deploy1
        continue-on-error: true
        timeout-minutes: 15
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          timeout: 60000
          log-level: verbose
          local-dir: ./dist/
          server-dir: /public_html/

      - name: Wait before retry (attempt 2)
        if: steps.deploy1.outcome == 'failure'
        run: |
          echo "Attempt 1 failed (ECONNRESET or otherwise) — waiting 30s before retrying."
          sleep 30

      - name: Deploy to Hostinger via FTP (attempt 2/3)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 15
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          timeout: 60000
          log-level: verbose
          local-dir: ./dist/
          server-dir: /public_html/

      - name: Wait before retry (attempt 3)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: |
          echo "Attempt 2 failed as well — waiting 30s before the final retry."
          sleep 30

      # Final attempt is NOT continue-on-error — if this one also fails,
      # the job must still show red, not a silent false-green success.
      - name: Deploy to Hostinger via FTP (attempt 3/3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        timeout-minutes: 15
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          timeout: 60000
          log-level: verbose
          local-dir: ./dist/
          server-dir: /public_html/
