name: Build and Deploy to Hostinger
on:
  push:
    branches:
      - master
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm install
      - name: Build Project
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
          VITE_GOOGLE_PLACE_ID: ${{ secrets.VITE_GOOGLE_PLACE_ID }}
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
        run: npm run build
      # Retrying with ftps changed nothing — all 3 attempts failed at the
      # identical point ("creating folder assets/") with the identical
      # ECONNRESET, pointing at something server/environment-specific
      # rather than a random transient blip. Testing plain `ftp` here as
      # step 1 of isolating the cause — some shared-hosting FTP servers
      # handle plain-FTP passive-mode data connections more reliably than
      # explicit FTPS from GitHub-hosted runners. Acceptable here since
      # this only deploys public static site files, not secrets (the FTP
      # credentials themselves still only travel as GitHub Actions
      # secrets, never in this file). dangerous-clean-slate was already
      # never set in this workflow (confirmed, not changed) — so that
      # specific cause is ruled out without needing a code change.
      - name: Deploy to Hostinger via FTP (attempt 1/3)
        id: deploy1
        continue-on-error: true
        timeout-minutes: 15
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          timeout: 60000
          log-level: verbose
          local-dir: ./dist/
          server-dir: /public_html/

      - name: Wait before retry (attempt 2)
        if: steps.deploy1.outcome == 'failure'
        run: |
          echo "Attempt 1 failed (ECONNRESET or otherwise) — waiting 30s before retrying."
          sleep 30

      - name: Deploy to Hostinger via FTP (attempt 2/3)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 15
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          timeout: 60000
          log-level: verbose
          local-dir: ./dist/
          server-dir: /public_html/

      - name: Wait before retry (attempt 3)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: |
          echo "Attempt 2 failed as well — waiting 30s before the final retry."
          sleep 30

      # Final attempt is NOT continue-on-error — if this one also fails,
      # the job must still show red, not a silent false-green success.
      - name: Deploy to Hostinger via FTP (attempt 3/3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        timeout-minutes: 15
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          timeout: 60000
          log-level: verbose
          local-dir: ./dist/
          server-dir: /public_html/
