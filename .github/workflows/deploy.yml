name: Build and Deploy to Hostinger
on:
  push:
    branches:
      - master
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm install
      - name: Build Project
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
          VITE_GOOGLE_PLACE_ID: ${{ secrets.VITE_GOOGLE_PLACE_ID }}
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
        run: npm run build
      # Retrying (3x, with ftps then plain ftp) never helped — every attempt
      # failed at the identical point ("creating folder assets/") with the
      # identical ECONNRESET, which means it's deterministic, not transient.
      # Retrying a deterministic failure is pointless, so that pattern is
      # gone. Splitting the deploy instead: everything except assets/ first
      # (this is the bulk of the site and has never been the thing that
      # fails), then assets/ on its own with a longer timeout. If assets/
      # still resets, the rest of the site is already live and only the
      # assets/ step needs retrying by hand — not a full redeploy, and not
      # a failed job that reverts nothing.
      #
      # SFTP (port 22) would likely be more reliable than FTP here, but
      # switching to it needs confirming first that Hostinger's plan has
      # SSH/SFTP access enabled (hPanel → Advanced → SSH Access) and new
      # FTP_SFTP_* secrets — I have no access to hPanel to check that
      # myself, so this stays on FTP until that's confirmed.
      - name: Deploy site (everything except assets/) via FTP
        id: deploy-main
        timeout-minutes: 15
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          timeout: 60000
          log-level: verbose
          local-dir: ./dist/
          server-dir: /public_html/
          exclude: |
            **/assets/**
          # Own state-tracking file so this step's diff-against-remote
          # logic never mixes with the assets/-only step below — they
          # cover completely different local-dir/server-dir scopes.
          state-name: .ftp-deploy-sync-state-main.json

      # The main-site step above now succeeds reliably — confirmed by a
      # real run — and the ECONNRESET is isolated specifically to this
      # assets/ step, pointing at assets/'s own size/file-count as the
      # trigger, not the deploy as a whole. Checked the real dist/assets/
      # output to plan this rather than guessing: it's a FLAT directory
      # (Vite content-hashes every filename and drops them all in one
      # place — there are no images/, fonts/ subfolders to split by, so
      # "split by subfolder" isn't literally possible here). Split by file
      # TYPE instead, using extension globs that stay stable across builds
      # even though the hash in each filename changes every build:
      #   code (js+css)  ~2.8 MB
      #   PNGs           ~4.7 MB  (the largest group — most likely culprit)
      #   JPEGs          ~0.4 MB
      # Each step now transfers well under half of what the single
      # all-of-assets/ step was sending in one FTP session. Timeout raised
      # to 180s (from 120s) per step per the request, even though each
      # step now carries less data. On "passive mode / per-file retry":
      # I don't have live access to re-check this action's current docs,
      # and from what I know of it (built on the basic-ftp library) it
      # doesn't expose a user-facing passive-mode toggle or a connection-
      # retry-per-file input — there's nothing to enable here. If these
      # three still reset, that's a real server-side transfer-size/duration
      # limit on this Hostinger plan, not something any client-side config
      # here can work around.
      - name: "Deploy assets/ via FTP (code: js, css)"
        id: deploy-assets-code
        timeout-minutes: 15
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          timeout: 180000
          log-level: verbose
          local-dir: ./dist/assets/
          server-dir: /public_html/assets/
          dangerous-clean-slate: false
          exclude: |
            **/*.png
            **/*.jpg
            **/*.jpeg
            **/*.gif
            **/*.webp
            **/*.svg
          state-name: .ftp-deploy-sync-state-assets-code.json

      - name: Deploy assets/ via FTP (PNG images)
        id: deploy-assets-png
        timeout-minutes: 15
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          timeout: 180000
          log-level: verbose
          local-dir: ./dist/assets/
          server-dir: /public_html/assets/
          dangerous-clean-slate: false
          exclude: |
            **/*.js
            **/*.css
            **/*.jpg
            **/*.jpeg
            **/*.gif
            **/*.webp
            **/*.svg
          state-name: .ftp-deploy-sync-state-assets-png.json

      - name: Deploy assets/ via FTP (JPEG images)
        id: deploy-assets-jpeg
        timeout-minutes: 15
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          timeout: 180000
          log-level: verbose
          local-dir: ./dist/assets/
          server-dir: /public_html/assets/
          dangerous-clean-slate: false
          exclude: |
            **/*.js
            **/*.css
            **/*.png
            **/*.gif
            **/*.webp
            **/*.svg
          state-name: .ftp-deploy-sync-state-assets-jpeg.json
