name: Daily Health News Draft

# Runs scripts/fetch-health-news.js once a day to draft new Medical News
# items from NewsAPI + Gemini, written straight into Firestore via
# firebase-admin (a service account) — no Cloud Function, no Blaze plan.
# Drafts land in the same `news` collection the Medical News admin page
# already reads, with status "Draft" and no thumbnail, for a human to
# review and publish manually.

on:
  schedule:
    # 05:00 UTC = 10:00 AM PKT — well before an evening admin review.
    - cron: '0 5 * * *'
  workflow_dispatch: {} # manual "Run workflow" button, for testing

jobs:
  fetch-health-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch and draft health news
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/fetch-health-news.js
